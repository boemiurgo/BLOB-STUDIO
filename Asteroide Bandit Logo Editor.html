<style>:root {
  color-scheme: light dark;
  background-color: var(
    --background,
    var(--color-background-primary, light-dark(rgb(255 255 255), rgb(24 24 24)))

  /* Agent-facing contract; keep in sync with SKILL.md. */
  --background: var(
    --color-background-primary,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --card: color-mix(in oklab, var(--foreground) 5%, var(--background));
  --card-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --popover: var(
    --color-background-secondary,
    light-dark(rgb(255 255 255), rgb(45 45 45))
  );
  --popover-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --primary: var(
    --color-text-info,
    light-dark(rgb(51 156 255), rgb(131 195 255))
  );
  --primary-foreground: var(
    --color-text-inverse,
    light-dark(rgb(255 255 255), rgb(13 13 13))
  );
  --secondary: var(
    --color-background-secondary,
    light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%))
  );
  --secondary-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --muted: color-mix(in srgb, var(--foreground) 10%, transparent);
  --muted-foreground: var(
    --color-text-secondary,
    light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%))
  );
  --accent: var(
    --color-background-info,
    light-dark(rgb(229 242 255), rgb(13 39 63))
  );
  --accent-foreground: var(
    --color-text-info,
    light-dark(rgb(51 156 255), rgb(131 195 255))
  );
  --destructive: var(
    --color-text-warning,
    light-dark(rgb(226 85 7), rgb(255 133 73))
  );
  --border: var(
    --color-border-secondary,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );
  --input: var(
    --color-border-primary,
    light-dark(
      rgb(26 28 31 / 11.8%),
      color-mix(in oklab, rgb(0 0 0) 10%, transparent)
    )
  );
  --ring: var(
    --color-ring-primary,
    light-dark(rgb(51 156 255), rgb(131 195 255 / 76%))
  );
  --font-size-base: var(--font-text-md-size, 14px);

  --green: light-dark(rgb(0 162 64), rgb(64 201 119));
  --red: light-dark(rgb(224 46 42), rgb(255 103 100));
  --purple: light-dark(rgb(146 79 247), rgb(173 123 249));
  --yellow: light-dark(rgb(255 195 0), rgb(255 210 64));

  --viz-series-3: light-dark(rgb(93 201 119), rgb(116 213 139));
  --viz-series-4: light-dark(rgb(235 119 177), rgb(240 143 192));
  --viz-series-5: light-dark(rgb(155 121 236), rgb(170 145 239));
  --viz-series-6: light-dark(rgb(58 185 177), rgb(90 203 194));

  /* Internal implementation variables; not part of the agent contract. */
  --font-sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono:
    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
    monospace;
  --font-size-normal: max(11px, var(--font-size-base));
  --font-size-tooltip: calc(var(--font-size-base) - 1px);
  --font-size-small: max(11px, calc(var(--font-size-base) - 2px));

  --font-size-h2: calc(var(--font-size-normal) * 1.4285714286);
  --font-size-h3: calc(var(--font-size-normal) * 1.2857142857);

  --line-height-small: calc(var(--font-size-small) + 4px);
  --corner-shape: round;
  --radius: var(--border-radius-lg, 10px);

  --viz-accent-bg: var(--accent);
  --viz-font-size: var(--font-size-base);
  --viz-warning: var(--destructive);
}

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);

  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

#bandit-app { --ink:#232321;--quiet:#797a75;--line:#e4e4de;--paper:#f6f6f1;--panel:#fff; font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink);max-width:1440px;margin:0 auto;padding:8px 20px 0;color-scheme:light; }
#bandit-app * {box-sizing:border-box;}
#bandit-app button,#bandit-app input,#bandit-app select {font:inherit;color:inherit;}
#bandit-app button {cursor:pointer;}
#bandit-app button:disabled {cursor:default;opacity:.35;}

#bandit-app .app-header {display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0 28px;}
#bandit-app .brand {display:flex;align-items:center;gap:18px;white-space:nowrap;font-weight:500;}
#bandit-app .brand svg {display:block;}
#bandit-app .brand-divider {height:24px;width:1px;background:var(--line);}
#bandit-app .header-right {display:flex;align-items:center;gap:14px;color:var(--quiet);font-size:12px;}
#bandit-app .offline-badge {border:1px solid var(--line);border-radius:5px;padding:4px 7px;letter-spacing:.08em;color:#55594d;font-size:10px;font-weight:600;}
#bandit-app .workspace {display:grid;grid-template-columns:290px minmax(0,1fr);gap:34px;align-items:start;}
#bandit-app .settings-panel {padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:16px;}
#bandit-app .panel-heading {margin-bottom:24px;}
#bandit-app [hidden] {display:none!important;}
#bandit-app h1 {font-size:24px;line-height:1.15;letter-spacing:-.6px;font-weight:500;margin:0 0 8px;}
#bandit-app h2 {font-size:12px;line-height:1.4;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin:0 0 16px;color:#686b60;}
#bandit-app p {margin:0;}
#bandit-app .panel-heading p {color:var(--quiet);font-size:12px;}
#bandit-app .field {display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:500;min-width:0;}
#bandit-app select,#bandit-app input[type="text"] {width:100%;height:39px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel);font-size:13px;}
#bandit-app .control-section {border-top:1px solid var(--line);padding-top:20px;margin-top:23px;}
#bandit-app .color-row {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:13px;}
#bandit-app .color-picker {display:flex;align-items:center;gap:10px;}
#bandit-app .color-picker output {font-size:11px;font-family:Consolas,monospace;color:var(--quiet);}
#bandit-app .color-swatch-btn {appearance:none;-webkit-appearance:none;width:33px;height:29px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;}
#bandit-app .color-input-hidden {position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;opacity:0;overflow:hidden;pointer-events:none;}
#bandit-app .slider-field {display:block;margin:16px 0 0;font-size:13px;}
#bandit-app .slider-field:first-child {margin-top:0;}
#bandit-app .slider-field > span {display:flex;justify-content:space-between;margin-bottom:7px;}
#bandit-app .slider-field output {color:var(--quiet);font-size:12px;font-variant-numeric:tabular-nums;}
#bandit-app input[type="range"] {display:block;width:100%;height:14px;margin:0;accent-color:#30342c;cursor:pointer;}
#bandit-app .check-field {display:flex;align-items:center;gap:8px;font-size:12px;color:#3a3c35;margin-top:14px;}
#bandit-app input[type="checkbox"] {accent-color:#30342c;width:15px;height:15px;margin:0;}
#bandit-app .color-sheet-backdrop {position:fixed;inset:0;z-index:55;background:transparent;}
#bandit-app .color-sheet-backdrop[hidden] {display:none;}
#bandit-app .color-sheet {position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:660px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(20,20,18,.25);padding:12px 18px 22px;}
#bandit-app .color-sheet[hidden] {display:none;}
#bandit-app .color-sheet-bar {width:36px;height:4px;border-radius:2px;background:#dcded4;margin:0 auto 14px;}
#bandit-app .color-sheet-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:500;font-size:14px;}
#bandit-app .color-sv {position:relative;width:100%;height:150px;border-radius:10px;overflow:hidden;touch-action:none;margin-bottom:18px;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent);cursor:pointer;}
#bandit-app .color-sv-thumb {position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
#bandit-app .color-hue {position:relative;width:100%;height:22px;border-radius:11px;touch-action:none;margin-bottom:18px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;}
#bandit-app .color-hue-thumb {position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
#bandit-app .color-hex-row {display:flex;align-items:center;gap:10px;}
#bandit-app .color-hex-swatch {width:33px;height:29px;border-radius:6px;border:1px solid var(--line);flex:none;}
#bandit-app .color-hex-row input {flex:1;height:39px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel);font-size:13px;text-transform:uppercase;font-family:Consolas,monospace;}
#bandit-app .button {border:1px solid transparent;border-radius:8px;padding:10px 15px;font-size:12px;font-weight:500;white-space:nowrap;min-height:39px;transition:background .12s;}
#bandit-app .button.full {width:100%;}
#bandit-app .button.primary {background:#252821;color:#fff;}
#bandit-app .button.primary:hover {background:#454c3b;}
#bandit-app .button.secondary {background:#fff;border-color:#dadbd3;}
#bandit-app .button.secondary:hover {background:#f2f3ed;}
#bandit-app .button.quiet {background:transparent;color:#606457;padding:6px 10px;min-height:32px;font-size:12px;}
#bandit-app .button.quiet:hover:not(:disabled) {background:#eceee5;}
#bandit-app .preview-panel {min-width:0;padding-top:4px;}
#bandit-app .checker {background-color:#f8f8f5;background-image:conic-gradient(#eeefe9 25%,transparent 0 50%,#eeefe9 0 75%,transparent 0);background-size:22px 22px;}
#bandit-app .logo-stage {width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #e6e7df;border-radius:14px;padding:0;overflow:hidden;}
#bandit-app .logo-stage > svg {display:block;width:100%;height:100%;}
#bandit-app .download-panel {margin:0;padding:16px;background:#eeefe8;border-radius:13px;}

#bandit-app .png-size {width:138px;margin-right:auto;}

<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const root=$('bandit-app');
  const defaults={bg:'#cf3a3a',transparentBg:false,text:'#2d66d0',shadow:false,shadowColor:'#000000',shadowOffset:10,stretch:100};
  const presets=[
    {id:'arcade-blue',name:'Arcade Blue',bg:'#cf3a3a',text:'#2d66d0',shadow:false,shadowColor:'#000000'},
    {id:'midnight-ember',name:'Midnight Ember',bg:'#000000',text:'#cf3a3a',shadow:false,shadowColor:'#000000'},
    {id:'storm-gold',name:'Storm Gold',bg:'#434343',text:'#cfc33a',shadow:false,shadowColor:'#000000'},
    {id:'rust-gold',name:'Rust & Gold',bg:'#503a18',text:'#cf3a3a',shadow:true,shadowColor:'#cfc33a'},
    {id:'deep-teal',name:'Deep Teal',bg:'#15666b',text:'#cfc33a',shadow:true,shadowColor:'#cf3a3a'},
    {id:'retro-magenta',name:'Retro Magenta',bg:'#cfc33a',text:'#cf3aca',shadow:false,shadowColor:'#000000'},
    {id:'ice-teal',name:'Ice Teal',bg:'#ffffff',text:'#3acfb8',shadow:true,shadowColor:'#cf3a87'},
    {id:'gold-rush',name:'Gold Rush',bg:'#cc2424',text:'#c79221',shadow:true,shadowColor:'#165430'},
    {id:'alien-green',name:'Alien Green',bg:'#57bc4d',text:'#28261c',shadow:true,shadowColor:'#dadada'},
    {id:'cosmic-purple',name:'Cosmic Purple',bg:'#8338a9',text:'#d0893c',shadow:true,shadowColor:'#2e2720'}
  ];
  const resetValues={shadowOffset:10,stretch:100};
  let state={...defaults}, committed={...defaults}, undoStack=[], redoStack=[];
  let preferences={size:4096,selected:'preset:arcade-blue'};
  const inputList=[...root.querySelectorAll('[data-setting]')];
  $('stage').appendChild($('logo-source').content.cloneNode(true));
  const svg=$('stage').querySelector('svg');
  const backdropRect=svg.querySelector('#backdrop-rect');
  const artStretch=svg.querySelector('#art-stretch');
  const shadowLayer=svg.querySelector('#shadow-layer');
  const shadowPath=svg.querySelector('#shadow-path');
  const lettersPath=svg.querySelector('#letters-path');
  const eyesPath=svg.querySelector('#eyes-path');
  const BASE_W=1800,BASE_H=720,PAD_X=70,PAD_Y=130;
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  function isHex(v){return /^#[0-9a-f]{6}$/i.test(v||'');}
  function validState(value) {
    if(!value||typeof value!=='object'||Array.isArray(value))throw Error('This file does not contain logo settings.');
    const next={...defaults};
    for(const name of ['bg','text','shadowColor'])if(isHex(value[name]))next[name]=value[name].toLowerCase();
    const ranges={shadowOffset:[0,40],stretch:[70,130]};
    for(const [name,[min,max]] of Object.entries(ranges))if(typeof value[name]==='number'&&Number.isFinite(value[name]))next[name]=Math.round(Math.max(min,Math.min(max,value[name])));
    next.transparentBg=!!value.transparentBg;
    next.shadow=!!value.shadow;
    return next;
  }
  function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error);}
  function rebuildVersionMenu(){
    $('version-select').innerHTML='';
    const presetGroup=document.createElement('optgroup');presetGroup.label='Palettes';
    for(const p of presets){const option=document.createElement('option');option.value='preset:'+p.id;option.textContent=p.name;presetGroup.appendChild(option);}
    $('version-select').appendChild(presetGroup);
    const customOption=document.createElement('option');customOption.value='custom';customOption.textContent='Custom edits';
    $('version-select').appendChild(customOption);
    $('version-select').value=preferences.selected;
  }
  function paint(){
    backdropRect.setAttribute('fill',state.bg);
    svg.querySelector('#backdrop').style.display=state.transparentBg?'none':'';
    lettersPath.setAttribute('fill',state.text);
    eyesPath.setAttribute('fill',state.text);
    shadowLayer.style.display=state.shadow?'':'none';
    shadowPath.setAttribute('fill',state.shadowColor);
    shadowLayer.setAttribute('transform','translate('+state.shadowOffset+' '+state.shadowOffset+')');
    artStretch.setAttribute('transform','translate('+(BASE_W/2)+' '+(BASE_H/2)+') scale(1 '+(state.stretch/100)+') translate('+(-BASE_W/2)+' '+(-BASE_H/2)+')');
    const vx=-PAD_X,vy=-PAD_Y,vw=BASE_W+2*PAD_X,vh=BASE_H+2*PAD_Y;
    svg.setAttribute('viewBox',vx+' '+vy+' '+vw+' '+vh);
    backdropRect.setAttribute('x',vx);backdropRect.setAttribute('y',vy);backdropRect.setAttribute('width',vw);backdropRect.setAttribute('height',vh);
    $('stage').classList.toggle('checker',state.transparentBg);
    $('stage').style.background=state.transparentBg?'':state.bg;
    for(const input of inputList){const key=input.dataset.setting;if(input.type==='checkbox')input.checked=state[key];else input.value=state[key];}
    root.querySelectorAll('[data-value]').forEach(el=>el.textContent=state[el.dataset.value]+(el.dataset.unit==='px'?' px':'%'));
    $('text-value').textContent=state.text.toUpperCase();$('bg-value').textContent=state.bg.toUpperCase();$('shadowColor-value').textContent=state.shadowColor.toUpperCase();
    $('text-color-btn').style.background=state.text;$('bg-color-btn').style.background=state.bg;$('shadow-color-btn').style.background=state.shadowColor;
    root.querySelector('#shadow-heading').closest('.control-section').querySelectorAll('.color-row,.slider-field').forEach(el=>el.style.opacity=state.shadow?'1':'.4');
    $('export-size').value=preferences.size;
    $('version-select').value=preferences.selected;
  }
  function commit(){if(!same(state,committed)){undoStack.push({...committed});if(undoStack.length>80)undoStack.shift();redoStack=[];committed={...state};}paint();}
  function changeTo(next){state=validState(next);commit();}
  for(const input of inputList){
    input.addEventListener('input',()=>{state[input.dataset.setting]=input.type==='checkbox'?input.checked:input.type==='color'?input.value:Number(input.value);preferences.selected='custom';paint();notice('Preview updated.');});
    input.addEventListener('change',commit);
  }
  function hex2rgb(hex){let s=(hex||'#000000').replace('#','');if(s.length===3)s=[...s].map(c=>c+c).join('');const n=parseInt(s,16)||0;return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
  function rgb2hex(c){return '#'+['r','g','b'].map(k=>Math.round(Math.max(0,Math.min(255,c[k]))).toString(16).padStart(2,'0')).join('');}
  function rgb2hsv({r,g,b}){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d!==0){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);}if(h<0)h+=360;const s=max===0?0:d/max;return {h,s,v:max};}
  function hsv2rgb({h,s,v}){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return {r:(r+m)*255,g:(g+m)*255,b:(b+m)*255};}
  function isMobileViewport(){return matchMedia('(max-width:660px)').matches;}
  let sheetTarget=null,sheetHue=0,sheetSat=0,sheetVal=0;
  function sheetHex(){return rgb2hex(hsv2rgb({h:sheetHue,s:sheetSat,v:sheetVal}));}
  function updateSheetVisual(){
    const hex=sheetHex();
    $('color-sv').style.backgroundColor='hsl('+sheetHue+',100%,50%)';
    $('color-sv-thumb').style.left=(sheetSat*100)+'%';
    $('color-sv-thumb').style.top=((1-sheetVal)*100)+'%';
    $('color-hue-thumb').style.left=(sheetHue/360*100)+'%';
    $('color-hex-swatch').style.background=hex;
    $('color-hex-input').value=hex.slice(1).toUpperCase();
  }
  function applySheetColor(commitNow){
    if(!sheetTarget)return;
    sheetTarget.value=sheetHex();
    sheetTarget.dispatchEvent(new Event('input',{bubbles:true}));
    if(commitNow)sheetTarget.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function openColorSheet(input,label){
    sheetTarget=input;
    const {h,s,v}=rgb2hsv(hex2rgb(input.value));
    sheetHue=h;sheetSat=s;sheetVal=v;
    $('color-sheet-title').textContent=label;
    updateSheetVisual();
    $('color-sheet').hidden=false;
    $('color-sheet-backdrop').hidden=false;
  }
  function closeColorSheet(){
    $('color-sheet').hidden=true;
    $('color-sheet-backdrop').hidden=true;
    sheetTarget=null;
  }
  function bindDrag(el,handler){
    el.addEventListener('pointerdown',event=>{
      event.preventDefault();
      el.setPointerCapture(event.pointerId);
      handler(event);
      const move=e=>handler(e);
      const up=()=>{
        el.releasePointerCapture(event.pointerId);
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up);
        el.removeEventListener('pointercancel',up);
        applySheetColor(true);
      };
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
      el.addEventListener('pointercancel',up);
    });
  }
  bindDrag($('color-sv'),event=>{
    const rect=$('color-sv').getBoundingClientRect();
    sheetSat=Math.min(1,Math.max(0,(event.clientX-rect.left)/rect.width));
    sheetVal=1-Math.min(1,Math.max(0,(event.clientY-rect.top)/rect.height));
    updateSheetVisual();applySheetColor(false);
  });
  bindDrag($('color-hue'),event=>{
    const rect=$('color-hue').getBoundingClientRect();
    sheetHue=Math.min(1,Math.max(0,(event.clientX-rect.left)/rect.width))*360;
    updateSheetVisual();applySheetColor(false);
  });
  $('color-hex-input').addEventListener('input',()=>{
    const v=$('color-hex-input').value.trim();
    if(/^[0-9a-f]{6}$/i.test(v)){const {h,s,v:val}=rgb2hsv(hex2rgb('#'+v));sheetHue=h;sheetSat=s;sheetVal=val;
      $('color-sv').style.backgroundColor='hsl('+sheetHue+',100%,50%)';
      $('color-sv-thumb').style.left=(sheetSat*100)+'%';$('color-sv-thumb').style.top=((1-sheetVal)*100)+'%';
      $('color-hue-thumb').style.left=(sheetHue/360*100)+'%';$('color-hex-swatch').style.background='#'+v;
      applySheetColor(false);
    }
  });
  $('color-hex-input').addEventListener('change',()=>applySheetColor(true));
  $('color-sheet-close').addEventListener('click',closeColorSheet);
  $('color-sheet-backdrop').addEventListener('click',closeColorSheet);
  function wireSwatch(btnId,inputId,label){
    const btn=$(btnId),input=$(inputId);
    btn.addEventListener('click',()=>{isMobileViewport()?openColorSheet(input,label):input.click();});
  }
  wireSwatch('text-color-btn','text-color','Letters color');
  wireSwatch('bg-color-btn','bg-color','Background color');
  wireSwatch('shadow-color-btn','shadow-color','Shadow color');
  root.querySelectorAll('.slider-field').forEach(line=>{
    const input=line.querySelector('input[type="range"]');
    if(!input)return;
    const key=input.dataset.setting,value=resetValues[key],unit=key==='shadowOffset'?' px':'%';
    line.title='Double-click to reset to '+value+unit;
    line.addEventListener('dblclick',event=>{
      event.preventDefault();
      preferences.selected='custom';changeTo({...state,[key]:value});
      notice(input.getAttribute('aria-label')+' reset to '+value+unit+'.');
    });
  });
  $('version-select').addEventListener('change',()=>{
    const key=$('version-select').value;preferences.selected=key;
    if(key==='custom')return;
    const preset=presets.find(p=>'preset:'+p.id===key);
    if(preset){changeTo({...state,bg:preset.bg,text:preset.text,shadow:preset.shadow,shadowColor:preset.shadowColor,shadowOffset:preset.shadow?resetValues.shadowOffset:0,transparentBg:false});notice('“'+preset.name+'” palette applied.');}
  });
  function doUndo(){if(!undoStack.length)return;redoStack.push({...state});state=undoStack.pop();committed={...state};preferences.selected='custom';paint();notice('Previous edit restored.');}
  function doRedo(){if(!redoStack.length)return;undoStack.push({...state});state=redoStack.pop();committed={...state};preferences.selected='custom';paint();notice('Edit restored.');}
  document.addEventListener('keydown',event=>{if(!(event.ctrlKey||event.metaKey)||event.target.matches('input[type="text"],textarea'))return;if(event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?doRedo():doUndo();}else if(event.key.toLowerCase()==='y'){event.preventDefault();doRedo();}});
  $('export-size').addEventListener('change',()=>{preferences.size=Number($('export-size').value);paint();});
  function paletteSlug(){
    if(preferences.selected.startsWith('preset:')){const preset=presets.find(p=>'preset:'+p.id===preferences.selected);if(preset)return preset.id;}
    return 'custom';
  }
  function filename(){return 'asteroide-bandit-112-'+paletteSlug();}
  function download(blob,name){
    const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.rel='noopener';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }
  function svgExport(){
    const copy=svg.cloneNode(true);const box=svg.viewBox.baseVal;
    copy.setAttribute('xmlns','http://www.w3.org/2000/svg');copy.setAttribute('width',String(box.width));copy.setAttribute('height',String(box.height));
    copy.removeAttribute('style');copy.querySelector('title').textContent='Asteroïde Bandit 112 logo';
    copy.querySelector('desc').textContent='Editable Asteroïde Bandit 112 logo, exported from Bandit Logo Studio.'+(state.transparentBg?' Transparent background.':' Solid background.');
    copy.querySelectorAll('*').forEach(el=>el.removeAttribute('style'));
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(copy);
  }
  $('download-svg').addEventListener('click',()=>{try{commit();download(new Blob([svgExport()],{type:'image/svg+xml;charset=utf-8'}),filename()+'.svg');notice('SVG download started.');}catch(e){notice('Could not export SVG: '+e.message,true);}});
  $('download-png').addEventListener('click',async()=>{
    const button=$('download-png');button.disabled=true;button.textContent='Preparing PNG…';
    let url;
    try{
      commit();const box=svg.viewBox.baseVal;const width=preferences.size,height=Math.round(width*box.height/box.width);
      const name=filename();url=URL.createObjectURL(new Blob([svgExport()],{type:'image/svg+xml;charset=utf-8'}));
      const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('The logo could not be rendered.'));image.src=url;});
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const context=canvas.getContext('2d');if(!context)throw Error('Canvas is unavailable.');
      context.drawImage(image,0,0,width,height);
      const png=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('PNG creation failed.')),'image/png'));
      download(png,name+'-'+width+'px.png');notice((state.transparentBg?'Transparent':'Solid background')+' PNG download started.');canvas.width=canvas.height=1;
    }catch(e){notice('Could not export PNG: '+e.message,true);}finally{if(url)URL.revokeObjectURL(url);button.disabled=false;button.textContent='Download PNG';}
  });
  rebuildVersionMenu();paint();
})();
</script>

</body>
</html>
