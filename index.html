:root {
  --night:#141412;
  --cream:#efeee6;
  --cream-quiet:#c9c8bf;
  --paper:#f6f6f1;
  --panel:#ffffff;
  --well:#eeefe8;
  --ink:#232321;
  --quiet:#5f6158;
  --pixel-ink:#000000;
  --signal:#b8ff1a;
  --splash:#ff5a36;
  --dmg-light:#9bbc0f;
  --dmg-dark:#306230;
  --window-title:#4f4f4f;
  --window-title-ink:#f7f7f7;
  --shadow-ink:4px 4px 0 #000000;
  --shadow-hard-sm:2px 2px 0 #000000;
  --pixel-font:"BLOB Pixel","Press Start 2P",Consolas,monospace;
  --grid-font:"BLOB Grid","BLOB Pixel",Consolas,monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body {
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background-color:var(--paper);
  background-image:radial-gradient(#dcded4 1px,transparent 1.2px);
  background-size:20px 20px;
  color:var(--ink);
  font:14px/1.45 "Segoe UI",Arial,sans-serif;
}
.px { font-family:var(--pixel-font); font-size:10px; line-height:1.2; letter-spacing:.1em; text-transform:uppercase; -webkit-font-smoothing:none; }

/* Header band: pixel wordmark on the left, the colour blocks and the b on the right */
.masthead {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:stretch;
  background:var(--night);
  color:var(--cream);
  border-bottom:4px solid var(--pixel-ink);
  overflow:hidden;
}
.masthead-text { display:flex; flex-direction:column; justify-content:center; padding:min(20px,2.5vh) 32px; min-width:0; }
.masthead h1 {
  margin:0;
  font-family:var(--grid-font);
  font-weight:400;
  font-size:min(64px,7.5vh);
  line-height:1;
  letter-spacing:0;
  -webkit-font-smoothing:none;
}
.masthead h1 span { display:block; }
/* The font draws on a 0.1em pixel grid: b is 7x9 pixels with a 2-pixel gap, like the logo's first b */
.masthead h1 .b-first { display:inline-block; width:.7em; height:.9em; margin-right:.2em; vertical-align:baseline; }
.masthead-art { display:block; height:min(180px,21vh); width:auto; }

/* Editors: two pixel windows */
main {
  flex:1;
  width:100%;
  max-width:880px;
  margin:0 auto;
  padding:min(50px,5vh) 20px min(40px,4vh);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;
  overflow:auto;
}
.grid { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; }
.card {
  display:flex;
  flex-direction:column;
  width:min(200px,26vh);
  aspect-ratio:1;
  background:var(--panel);
  color:inherit;
  text-decoration:none;
  border:2px solid var(--pixel-ink);
  box-shadow:var(--shadow-ink);
  transition:transform .12s, box-shadow .12s;
}
.card:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--pixel-ink); }
.card:active { transform:translate(2px,2px); box-shadow:none; }
.card:focus-visible { outline:2px solid var(--dmg-dark); outline-offset:4px; }
.win-title {
  display:flex;
  align-items:center;
  gap:8px;
  height:30px;
  padding:0 8px 0 10px;
  background:var(--window-title);
  color:var(--window-title-ink);
}
.win-led { margin-left:auto; width:8px; height:8px; background:var(--signal); box-shadow:0 0 0 2px var(--pixel-ink); }
.card-art {
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
  min-height:0;
  border-bottom:2px solid var(--pixel-ink);
}
.card-art img { display:block; height:100%; width:auto; max-width:100%; object-fit:contain; }
.card-art.logo { background:var(--night); }
.card-art.record { background:var(--dmg-dark); }
.card h2 { display:flex; align-items:center; justify-content:center; margin:0; padding:10px 8px; white-space:nowrap; line-height:1.2; font-family:var(--grid-font); font-size:min(14px,1.8vh); font-weight:400; text-align:center; -webkit-font-smoothing:none; }
.card:hover h2 { background:var(--signal); color:#000000; }

footer { padding:min(20px,2vh) 20px; text-align:center; color:var(--quiet); }
.reg { font-family:"Segoe UI",Arial,sans-serif; font-size:9px; vertical-align:top; margin-left:1px; }

@media(max-width:900px) {
  .masthead h1 { font-size:min(54px,6.5vh); }
  .masthead-art { height:min(150px,18vh); }
}
@media(max-width:700px) {
  .masthead-text { padding:14px 16px; }
  .masthead h1 { font-size:clamp(30px,10vw,46px); }
  .masthead-art { height:calc(clamp(30px,10vw,46px) * 2 + 28px); width:38vw; }
  main { padding:40px 16px 30px; }
  .grid { gap:20px; }
  .card { width:min(calc(50% - 10px),24vh); }
}
@media(prefers-reduced-motion:reduce) { .card, .card:hover, .card:active { transform:none; transition:none; } }
</style>
